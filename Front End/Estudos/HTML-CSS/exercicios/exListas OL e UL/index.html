<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icone F.ico" type="image/x-icon">
    <title>Listas OL e UL</title>
</head>
<body>
    <h1>Aprendendo sobre Listas</h1>
    <h2>Listas Ordenadas (OL)</h2>
    <ol type="A" start="3">
        <li>Acordar</li>
        <li>Ligar para o joao</li>
        <li>Tomar cafe</li>
    </ol>
    <h2>Listas não Ordenadas</h2>
    <h3>Lista de compra:</h3>
    <ul type="square">
        <li>Pao</li>
        <li>Cafe</li>
        <li>Leite</li>
    </ul>
</body>

</html>
